[project]
name = "falsification-at"
version = "0.1.0"
description = "Falsification Examples using SpecForge SDK and Psy-Taliro"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "jupyter>=1.1.1",
    "matlab>=0.1",
    "matlabengine==25.2.2",
    "numpy>=1.26.4",
    "pandas>=2.3.3",
    "plotly>=6.3.1",
    "psy-taliro>=1.0.0",
    "specforge-sdk",
]

[tool.uv.sources]
specforge_sdk = { path = "lib/specforge_sdk-0.5.11-py3-none-any.whl" }
